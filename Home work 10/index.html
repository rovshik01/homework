<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Формы</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
 <form class="form">
    <fieldset>
        <h3>Ваши личные данные</h3>
        <label>
            Ваше имя
        </label>
        <input type="text" placeholder="Имя" required>
        <label>
            Ваш возраст
        </label>
        <input type="number" placeholder="Возраст" required>
        <label>
            Ваш номер телефона
        </label>
        <input type="number" placeholder="Номер телефона" required>
        <label>
            Ваша почта
        </label>
        <input type="email" placeholder="Почта" required>
        <label>
            Сообщение
        </label>
        <textarea name="" id="" placeholder="Ваше сообщение"></textarea>
        <label> 
            <input type="checkbox">
            Я принимаю правила
        </label>
        <button class="button">Отправить</button>
    </fieldset>
 </form>
</body>

</html>
